import java.util.Properties

def requiredJava = JavaVersion.VERSION_21
if (JavaVersion.current() != requiredJava) {
    throw new GradleException(
        "Embedra requires JDK 21 for the Ghidra 12.1.3 baseline; current JVM is ${JavaVersion.current()}."
    )
}

def configuredGhidraDir = providers.gradleProperty('GHIDRA_INSTALL_DIR')
    .orElse(providers.environmentVariable('GHIDRA_INSTALL_DIR'))
    .getOrElse('')
def requestedTasks = gradle.startParameter.taskNames.collect { it.tokenize(':').last() }
def pureInvocation = configuredGhidraDir.isBlank() && !requestedTasks.isEmpty()
    && requestedTasks.every { it in ['clean', 'pureTest'] }

if (configuredGhidraDir.isBlank()) {
    if (!pureInvocation) {
        throw new GradleException(
            'Set GHIDRA_INSTALL_DIR or use the Ghidra-independent pureTest task.'
        )
    }
    apply plugin: 'java'
}
else {
    def ghidraInstallDir = file(configuredGhidraDir).canonicalFile
    def ghidraPropertiesFile = new File(ghidraInstallDir, 'Ghidra/application.properties')
    if (!ghidraPropertiesFile.isFile()) {
        throw new GradleException(
            "GHIDRA_INSTALL_DIR does not contain Ghidra/application.properties: ${ghidraInstallDir}"
        )
    }

    def ghidraProperties = new Properties()
    ghidraPropertiesFile.withReader('UTF-8') { reader -> ghidraProperties.load(reader) }
    def requiredGhidraVersion = '12.1.3'
    def configuredGhidraVersion = ghidraProperties.getProperty('application.version')
    if (configuredGhidraVersion != requiredGhidraVersion) {
        throw new GradleException(
            "Embedra requires Ghidra ${requiredGhidraVersion}; configured installation is ${configuredGhidraVersion ?: 'unknown'}."
        )
    }

    apply from: new File(ghidraInstallDir, 'support/buildExtension.gradle')
}

group = 'io.github.rezabakhshi.embedra'
apply from: rootProject.file('gradle/build-quality.gradle')

if (pureInvocation) {
    sourceSets.main.java.exclude 'io/github/rezabakhshi/embedra/ghidra/**'
}

tasks.register('pureTest') {
    group = 'verification'
    description = 'Runs the complete Ghidra-independent quality and test suite.'
    dependsOn tasks.named('check')
}

tasks.register('verifyEspCatalogGenerator', Exec) {
    group = 'verification'
    description = 'Runs offline ESP catalog generator and drift-contract tests.'
    commandLine 'python3', '-m', 'unittest', 'scripts/tests/test_generate_esp_catalog.py'
}

tasks.named('check') {
    dependsOn tasks.named('verifyEspCatalogGenerator')
}

tasks.register('verifyRpCatalogGenerator', Exec) {
    group = 'verification'
    description = 'Runs offline Raspberry Pi catalog and fixture generator tests.'
    commandLine 'python3', '-m', 'unittest', 'discover', '-s', 'scripts/tests',
        '-p', 'test_*rp*.py'
}

tasks.named('check') {
    dependsOn tasks.named('verifyRpCatalogGenerator')
}

tasks.register('verifySTM32CatalogGenerator', Exec) {
    group = 'verification'
    description = 'Runs offline STM32 catalog generator, coverage, and integrity tests.'
    commandLine 'python3', '-m', 'unittest', 'discover', '-s', 'scripts/tests',
        '-p', 'test_*stm32*.py'
}

tasks.named('check') {
    dependsOn tasks.named('verifySTM32CatalogGenerator')
}

tasks.register('verifySTM32FixtureCatalog', Exec) {
    group = 'verification'
    description = 'Validates selected STM32 records and golden fixture provenance/structure.'
    commandLine 'python3', 'scripts/validate-stm32-fixture-catalog.py'
}

tasks.named('check') {
    dependsOn tasks.named('verifySTM32FixtureCatalog')
}

tasks.register('licenseAudit', Exec) {
    group = 'verification'
    description = 'Runs the fail-closed license and redistribution audit (T076).'
    commandLine 'python3', 'scripts/audit-licenses.py', '--check'
}

tasks.named('check') {
    dependsOn tasks.named('licenseAudit')
}

tasks.register('secretScan', Exec) {
    group = 'verification'
    description = 'Runs the fail-closed repository secret scan (T078).'
    commandLine 'python3', 'scripts/scan-secrets.py'
}

tasks.named('check') {
    dependsOn tasks.named('secretScan')
}

tasks.register('supplyChainAudit', Exec) {
    group = 'verification'
    description = 'Runs the fail-closed dependency-locking, verification-metadata, and SBOM audit (T078).'
    commandLine 'python3', 'scripts/audit-supply-chain.py', '--check'
}

tasks.named('check') {
    dependsOn tasks.named('supplyChainAudit')
}

tasks.register('docsLinkAudit', Exec) {
    group = 'verification'
    description = 'Validates the documentation inventory and Markdown link health (T077).'
    commandLine 'python3', 'scripts/check-documentation-links.py'
}

tasks.named('check') {
    dependsOn tasks.named('docsLinkAudit')
}

if (!configuredGhidraDir.isBlank()) {
    sourceSets {
        integrationTest {
            java.srcDir 'src/integrationTest/java'
            resources.srcDir 'src/integrationTest/resources'
            resources.srcDir 'src/test/resources'
            compileClasspath += files(sourceSets.main.output, sourceSets.main.compileClasspath,
                configurations.testRuntimeClasspath)
            runtimeClasspath += output + compileClasspath
        }
    }
    configurations.integrationTestImplementation.extendsFrom configurations.testImplementation
    configurations.integrationTestRuntimeOnly.extendsFrom configurations.testRuntimeOnly

    tasks.register('ghidraIntegrationTest', Test) {
        group = 'verification'
        description = 'Runs tests compiled against the pinned Ghidra API.'
        testClassesDirs = sourceSets.integrationTest.output.classesDirs
        classpath = sourceSets.integrationTest.runtimeClasspath
        systemProperty 'ghidra.external.modules', project.projectDir.absolutePath
        shouldRunAfter tasks.named('test')
    }
    tasks.named('check') {
        dependsOn tasks.named('ghidraIntegrationTest')
    }
}

tasks.register('verifyProjectScaffold') {
    group = 'verification'
    description = 'Verifies the minimum pinned Ghidra extension project structure.'

    doLast {
        [
            'Module.manifest',
            'extension.properties',
            'gradlew',
            'gradlew.bat',
            'gradle/wrapper/gradle-wrapper.jar',
            'gradle/wrapper/gradle-wrapper.properties'
        ].each { relativePath ->
            if (!file(relativePath).isFile()) {
                throw new GradleException("Required project file is missing: ${relativePath}")
            }
        }

        def extensionProperties = new Properties()
        file('extension.properties').withReader('UTF-8') { reader ->
            extensionProperties.load(reader)
        }
        if (extensionProperties.getProperty('name') != '@extname@') {
            throw new GradleException('extension.properties must retain the @extname@ build token.')
        }
        if (extensionProperties.getProperty('version') != '@extversion@') {
            throw new GradleException('extension.properties must retain the @extversion@ build token.')
        }

        def wrapperProperties = new Properties()
        file('gradle/wrapper/gradle-wrapper.properties').withReader('UTF-8') { reader ->
            wrapperProperties.load(reader)
        }
        def distributionUrl = wrapperProperties.getProperty('distributionUrl', '')
        if (!distributionUrl.endsWith('/gradle-9.6.1-bin.zip')) {
            throw new GradleException("Gradle Wrapper must be pinned to 9.6.1; found ${distributionUrl}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyProjectScaffold')
}

tasks.named('processResources') {
    from(rootProject.file('schemas')) {
        into 'schemas'
    }
}

if (!configuredGhidraDir.isBlank()) {
    tasks.named('buildExtension') {
        dependsOn tasks.named('check')
        if (fileTree('src/main/java').matching { include '**/*.java' }.isEmpty()) {
            exclude '**/*-src.zip'
        }
        includeEmptyDirs = false
        exclude 'ghidra_12.1.3_PUBLIC_20260817/**'
        exclude '.github/**'
        exclude '.embedra/**'
        exclude '.codex/**'
        exclude 'docs/adr/**'
        // T077 / ADR 0027: repository-governance and AI-agent documents remain
        // repository-only; the release bundle links them through the README.
        exclude 'docs/agent-handoff.md'
        exclude 'SECURITY.md'
        exclude 'CONTRIBUTING.md'
        exclude 'CODE_OF_CONDUCT.md'
        exclude 'CHANGELOG.md'
        exclude 'Embedra-SpecKit.md'
        exclude 'esp32s3_ctf_dump_4MB.bin'
        exclude 'flash_dump.bin'
        exclude 'fixtures/**'
        exclude 'PROJECT_STATE.md'
        exclude 'config/**'
        exclude 'gradle/**'
        exclude 'gradle.lockfile'
        exclude 'gradle.properties'
        exclude 'scripts/**'
        exclude 'schemas/**'
        exclude 'catalogs/espressif/sources/**'
        exclude 'catalogs/stm32/2026-09-28/**'
        exclude 'catalogs/stm32/sources/**'
    }
}
