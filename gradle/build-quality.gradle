import java.nio.ByteBuffer
import java.nio.charset.CodingErrorAction
import java.nio.charset.StandardCharsets
import org.gradle.api.tasks.bundling.AbstractArchiveTask

apply plugin: 'checkstyle'
apply plugin: 'jacoco'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyLocking {
    lockAllConfigurations()
}

checkstyle {
    toolVersion = '14.1.0'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

jacoco {
    toolVersion = '0.8.15'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxParallelForks = 1
    systemProperty 'embedra.projectDir', rootProject.projectDir.absolutePath
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'user.country', 'US'
    systemProperty 'user.language', 'en'
    systemProperty 'user.timezone', 'UTC'
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        csv.required = true
        html.required = true
        xml.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            element = 'CLASS'
            includes = ['io.github.rezabakhshi.embedra.core.*']
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

def formattingInputs = files(
    fileTree(rootProject.file('src')) { include '**/*.java' },
    fileTree(rootProject.file('config')) { include '**/*.xml' },
    fileTree(rootProject.file('scripts')) { include '**/*.sh' },
    rootProject.file('build.gradle'),
    rootProject.file('settings.gradle'),
    rootProject.file('gradle.properties'),
    rootProject.file('extension.properties'),
    rootProject.file('README.md')
)

tasks.register('verifyFormatting') {
    group = 'verification'
    description = 'Checks UTF-8, LF endings, final newlines, tabs, and trailing whitespace.'
    inputs.files(formattingInputs)

    doLast {
        formattingInputs.files.sort { left, right -> left.path <=> right.path }.each { inputFile ->
            byte[] bytes = inputFile.bytes
            def decoder = StandardCharsets.UTF_8.newDecoder()
                .onMalformedInput(CodingErrorAction.REPORT)
                .onUnmappableCharacter(CodingErrorAction.REPORT)
            String text
            try {
                text = decoder.decode(ByteBuffer.wrap(bytes)).toString()
            }
            catch (Exception exception) {
                throw new GradleException("File is not valid UTF-8: ${inputFile}", exception)
            }
            if (text.startsWith('\uFEFF')) {
                throw new GradleException("UTF-8 BOM is not allowed: ${inputFile}")
            }
            if (text.contains('\r')) {
                throw new GradleException("Only LF line endings are allowed: ${inputFile}")
            }
            if (!text.endsWith('\n')) {
                throw new GradleException("Final newline is required: ${inputFile}")
            }
            text.readLines().eachWithIndex { line, index ->
                if (line.contains('\t')) {
                    throw new GradleException("Tab found at ${inputFile}:${index + 1}")
                }
                if (line != line.stripTrailing()) {
                    throw new GradleException("Trailing whitespace at ${inputFile}:${index + 1}")
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyFormatting')
    dependsOn tasks.named('jacocoTestReport')
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
