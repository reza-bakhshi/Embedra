name: foundation-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure:
    name: Pure tests and repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Record toolchain
        run: java -version
      - name: Validate fixture provenance
        run: sh scripts/validate-fixture-provenance.sh
      - name: Validate agent handoff
        run: sh scripts/validate-handoff.sh
      - name: Run Ghidra-independent suite
        run: ./gradlew --no-daemon clean pureTest

  ghidra-release:
    name: Ghidra integration and release ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GHIDRA_ARCHIVE: ghidra_12.1.3_PUBLIC_20260817.zip
      GHIDRA_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
      GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned Ghidra release
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --output "$RUNNER_TEMP/$GHIDRA_ARCHIVE" "$GHIDRA_URL"
          echo "$GHIDRA_SHA256  $RUNNER_TEMP/$GHIDRA_ARCHIVE" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$GHIDRA_ARCHIVE" -d "$RUNNER_TEMP/ghidra"
          echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/ghidra/ghidra_12.1.3_PUBLIC" >> "$GITHUB_ENV"
      - name: Run Ghidra integration and complete quality suite
        run: ./gradlew --no-daemon -PGHIDRA_INSTALL_DIR="$GHIDRA_INSTALL_DIR" clean check ghidraIntegrationTest buildExtension
      - name: Verify reproducible release ZIP
        run: sh scripts/verify-build-quality.sh
      - name: Record release checksum
        run: sha256sum dist/*_Embedra.zip > dist/Embedra.sha256
      - name: Upload release evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Embedra-Ghidra-12.1.3-${{ github.sha }}
          path: |
            dist/*_Embedra.zip
            dist/Embedra.sha256
          if-no-files-found: error
          retention-days: 14
