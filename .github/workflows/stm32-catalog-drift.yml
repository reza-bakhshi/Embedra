name: stm32-catalog-drift

on:
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-curated-f103-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Embedra
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Fetch current public board-use evidence
        run: |
          curl --fail --location --silent --show-error --max-time 40 \
            https://raw.githubusercontent.com/stm32duino/Arduino_Core_STM32/main/README.md \
            --output "$RUNNER_TEMP/stm32duino-readme.md"
          curl --fail --location --silent --show-error --max-time 40 \
            https://raw.githubusercontent.com/STMicroelectronics/STM32CubeF1/master/Projects/STM32F103RB-Nucleo/Examples/UART/UART_TwoBoards_ComDMA/readme.txt \
            --output "$RUNNER_TEMP/cubef1-example.txt"
      - name: Check curated selection for source drift
        run: |
          python3 scripts/check-stm32-curated-selection-drift.py \
            --arduino-readme "$RUNNER_TEMP/stm32duino-readme.md" \
            --cube-example "$RUNNER_TEMP/cubef1-example.txt" \
            --output "$RUNNER_TEMP/stm32-curated-selection-drift.json"
          python3 scripts/generate-stm32-curated-catalog.py check
      - name: Upload review result
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: stm32-curated-selection-drift-${{ github.run_id }}
          path: ${{ runner.temp }}/stm32-curated-selection-drift.json
          if-no-files-found: ignore
          retention-days: 14

  compare-official-st-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Embedra
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Fetch current ST pin database
        run: git clone --depth 1 https://github.com/STMicroelectronics/STM32_open_pin_data.git "$RUNNER_TEMP/st-pin"
      - name: Compare normalized catalog
        run: |
          python3 scripts/generate-stm32-catalog.py drift \
            --source "$RUNNER_TEMP/st-pin" \
            --baseline catalogs/stm32/2026-09-28/source-catalog.json \
            --output "$RUNNER_TEMP/stm32-catalog-drift.json"
      - name: Compare ST board source index
        if: always()
        run: |
          python3 scripts/generate-stm32-board-index.py drift \
            --repo "$RUNNER_TEMP/st-pin" \
            --baseline catalogs/stm32/sources/board-index.json \
            --output "$RUNNER_TEMP/stm32-board-index-drift.json"
      - name: Upload reviewable candidate on drift
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: stm32-catalog-drift-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stm32-catalog-drift.json
            ${{ runner.temp }}/stm32-board-index-drift.json
          if-no-files-found: ignore
          retention-days: 14

  compare-official-cmsis-headers:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Embedra
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Fetch current official ST CMSIS inputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          base = Path('${{ runner.temp }}') / 'stm32-cmsis'
          base.mkdir()
          manifest = json.loads(Path('catalogs/stm32/2026-09-28/cmsis-sources.json').read_text())
          for repo in manifest['repositories']:
              name = repo['name']
              subprocess.run(['git', 'clone', '--depth', '1', '--filter=blob:none', '--sparse',
                              'https://github.com/STMicroelectronics/' + name + '.git',
                              str(base / name)], check=True)
              subprocess.run(['git', '-C', str(base / name), 'sparse-checkout', 'set', 'Include'], check=True)
              repo['revision'] = subprocess.check_output(['git', '-C', str(base / name),
                                                          'rev-parse', 'HEAD'], text=True).strip()
          (base / 'current-sources.json').write_text(json.dumps(manifest))
          PY
      - name: Compare normalized IRQ index
        run: |
          python3 scripts/generate-stm32-cmsis-interrupts.py generate \
            --source catalogs/stm32/2026-09-28/source-catalog.json \
            --manifest "$RUNNER_TEMP/stm32-cmsis/current-sources.json" \
            --repos-root "$RUNNER_TEMP/stm32-cmsis" \
            --output "$RUNNER_TEMP/stm32-cmsis/current-interrupts.json"
          cmp catalogs/stm32/2026-09-28/cmsis-interrupts.json \
              "$RUNNER_TEMP/stm32-cmsis/current-interrupts.json"
      - name: Upload reviewable candidate on drift
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: stm32-cmsis-drift-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stm32-cmsis/current-sources.json
            ${{ runner.temp }}/stm32-cmsis/current-interrupts.json
          if-no-files-found: ignore
          retention-days: 14

  compare-st-authored-svd-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Embedra
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Fetch current ST-authored SVD transport
        run: git clone --depth 1 https://github.com/modm-io/cmsis-svd-stm32.git "$RUNNER_TEMP/st-svd"
      - name: Compare normalized SVD rule index
        run: |
          python3 scripts/generate-stm32-svd-rules.py drift \
            --source catalogs/stm32/2026-09-28/source-catalog.json \
            --svd-root "$RUNNER_TEMP/st-svd" \
            --output "$RUNNER_TEMP/stm32-svd-rules.json"
          cmp catalogs/stm32/2026-09-28/svd-rules.json "$RUNNER_TEMP/stm32-svd-rules.json"
      - name: Upload reviewable candidate on drift
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: stm32-svd-drift-${{ github.run_id }}
          path: ${{ runner.temp }}/stm32-svd-rules.json
          if-no-files-found: ignore
          retention-days: 14

  compare-official-c5-dfp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Embedra
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Fetch current BSD-licensed ST C5 DFP
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/STMicroelectronics/stm32c5xx-dfp.git "$RUNNER_TEMP/c5-dfp"
          git -C "$RUNNER_TEMP/c5-dfp" sparse-checkout set SVD
      - name: Compare exact C5 catalog
        run: |
          python3 scripts/generate-stm32-dfp-catalog.py drift \
            --repo "$RUNNER_TEMP/c5-dfp" \
            --output "$RUNNER_TEMP/c5-exact-parts.json"
          cmp catalogs/stm32/2026-09-28/c5-exact-parts.json "$RUNNER_TEMP/c5-exact-parts.json"
      - name: Upload reviewable candidate on drift
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: stm32-c5-dfp-drift-${{ github.run_id }}
          path: ${{ runner.temp }}/c5-exact-parts.json
          if-no-files-found: ignore
          retention-days: 14

  discover-new-st-dfp-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Embedra
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Fetch ST repository listing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X GET search/repositories -f q='org:STMicroelectronics dfp' \
            -f per_page=100 > "$RUNNER_TEMP/st-dfp-repos.json"
      - name: Audit STM32 DFP source licenses
        run: |
          python3 scripts/discover-stm32-dfp-sources.py \
            --repos-json "$RUNNER_TEMP/st-dfp-repos.json" \
            --output "$RUNNER_TEMP/st-dfp-audit.json"
      - name: Upload reviewable candidate on new source
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: stm32-dfp-source-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/st-dfp-repos.json
            ${{ runner.temp }}/st-dfp-audit.json
          if-no-files-found: ignore
          retention-days: 14
